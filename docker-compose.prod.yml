version: "3.8"

services:
  backend:
    image: ${IMAGE_BACKEND:?Set IMAGE_BACKEND (ECR URI) in .env.prod}
    ports:
      # Loopback only. "8000:8000" binds 0.0.0.0, and docker writes its own
      # iptables rules that bypass the host firewall, so the security group was
      # the single thing keeping the port off the internet.
      #
      # This is now load-bearing rather than defence in depth: the rate limiter
      # trusts X-Real-IP from any RFC1918 peer, because nginx runs on the host
      # and reaches the container across the docker bridge. Anything else that
      # could open a socket here would be able to name its own rate-limit
      # bucket. nginx proxies to 127.0.0.1:8000, so it is unaffected.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped

  frontend:
    image: ${IMAGE_FRONTEND:?Set IMAGE_FRONTEND (ECR URI) in .env.prod}
    ports:
      # Same reason; nginx proxies to 127.0.0.1:8080.
      - "127.0.0.1:8080:80"
    restart: unless-stopped
