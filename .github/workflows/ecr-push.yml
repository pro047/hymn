name: Build and Push to ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-push.outputs.image }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (cache for pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (for cache warm)
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" -f Dockerfile .
          docker push "${IMAGE_URI}"
          echo "image=${IMAGE_URI}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (docker compose pull && up)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          ECR_REPO: ${{ env.ECR_REPO }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET_INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -e
          IMG="${IMAGE_URI}"
          if [ -z "$IMG" ]; then
            ACCT=$(aws sts get-caller-identity --query Account --output text)
            IMG="${ACCT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}"
          fi
          PARAMS=$(jq -n \
            --arg img "${IMG}" \
            --arg env "${ENV_PROD}" \
            --arg region "${AWS_REGION}" \
            '{
              commands: [
                "if [ -z \"" + $img + "\" ]; then echo \"IMAGE_URI missing\" && exit 1; fi",
                "REGISTRY=$(echo \"" + $img + "\" | cut -d/ -f1)",
                "aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin $REGISTRY",
                "sudo mkdir -p /app",
                "cat > /app/docker-compose.yml <<\"YAML\"\nservices:\n  app:\n    image: " + $img + "\n    env_file:\n      - .env\n    ports:\n      - \"8000:8000\"\nYAML",
                "printf \"" + $env + "\\n\" | sudo tee /app/.env >/dev/null",
                "cd /app && sudo docker compose pull && sudo docker compose up -d"
              ]
            }')
          aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy hymn-api" \
            --parameters "$PARAMS"
