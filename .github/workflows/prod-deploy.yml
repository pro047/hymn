name: Build and Deploy (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO_PROD }}

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image_uri: ${{ steps.image-uri.outputs.backend_image }}
      frontend_image_uri: ${{ steps.image-uri.outputs.frontend_image }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend (arm64)
        id: build-push-backend
        uses: docker/build-push-action@v5
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend (arm64)
        id: build-push-frontend
        uses: docker/build-push-action@v5
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.FRONTEND_API_URL_PROD }}

      - name: Set image outputs
        id: image-uri
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "backend_image=${REGISTRY}/${ECR_REPO}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${REGISTRY}/${ECR_REPO}:${{ github.sha }}-frontend" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read compose file
        id: compose-file
        run: |
          echo 'content<<EOF' >> $GITHUB_OUTPUT
          cat docker-compose.prod.yml >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Read nginx config file
        id: nginx-file
        run: |
          echo 'content<<EOF' >> $GITHUB_OUTPUT
          cat nginx/prod.nginx.conf >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (docker compose pull && up)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_BACKEND: ${{ needs.build-and-push.outputs.backend_image_uri }}
          IMAGE_FRONTEND: ${{ needs.build-and-push.outputs.frontend_image_uri }}
          ECR_REPO: ${{ env.ECR_REPO }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET_INSTANCE: ${{ secrets.EC2_INSTANCE_ID_PROD }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          COMPOSE_CONTENT: ${{ steps.compose-file.outputs.content }}
          NGINX_CONF_CONTENT: ${{ steps.nginx-file.outputs.content }}
        run: |
          set -e
          IMG_BACKEND="${IMAGE_BACKEND}"
          IMG_FRONTEND="${IMAGE_FRONTEND}"
          if [ -z "$IMG_BACKEND" ] || [ -z "$IMG_FRONTEND" ]; then
            ACCT=$(aws sts get-caller-identity --query Account --output text)
            IMG_BACKEND="${ACCT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}"
            IMG_FRONTEND="${ACCT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}-frontend"
          fi
          PARAMS=$(jq -n \
            --arg img_backend "${IMG_BACKEND}" \
            --arg img_frontend "${IMG_FRONTEND}" \
            --arg env "${ENV_PROD}" \
            --arg region "${AWS_REGION}" \
            --arg compose "${COMPOSE_CONTENT}" \
            --arg nginx_conf "${NGINX_CONF_CONTENT}" \
            '{
              commands: [
                "if [ -z \"" + $img_backend + "\" ] || [ -z \"" + $img_frontend + "\" ]; then echo \"IMAGE_URI missing\" && exit 1; fi",
                "REGISTRY=$(echo \"" + $img_backend + "\" | cut -d/ -f1)",
                "aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin $REGISTRY",
                "sudo mkdir -p /app",
                "cat > /app/docker-compose.prod.yml <<\"YAML\"\n" + $compose + "\nYAML",
                "echo \"IMAGE_BACKEND=" + $img_backend + "\" | sudo tee /app/.env.prod >/dev/null",
                "echo \"IMAGE_FRONTEND=" + $img_frontend + "\" | sudo tee -a /app/.env.prod >/dev/null",
                "printf \"" + $env + "\\n\" | sudo tee -a /app/.env.prod >/dev/null",
                "cd /app && sudo docker compose --env-file /app/.env.prod -f /app/docker-compose.prod.yml pull",
                "cd /app && sudo docker compose --env-file /app/.env.prod -f /app/docker-compose.prod.yml run --rm backend alembic upgrade head",
                "cd /app && sudo docker compose --env-file /app/.env.prod -f /app/docker-compose.prod.yml up -d",
                "sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled",
                "cat > /tmp/score-hymn.nginx.conf <<\"NGINX\"\n" + $nginx_conf + "\nNGINX",
                "sudo mv /tmp/score-hymn.nginx.conf /etc/nginx/sites-available/score-hymn",
                "if [ ! -L /etc/nginx/sites-enabled/score-hymn ]; then sudo ln -s /etc/nginx/sites-available/score-hymn /etc/nginx/sites-enabled/score-hymn; fi",
                "if [ -e /etc/nginx/sites-enabled/default ]; then sudo rm -f /etc/nginx/sites-enabled/default; fi",
                "sudo nginx -t",
                "sudo systemctl enable nginx",
                "sudo systemctl reload nginx || sudo systemctl restart nginx"
              ]
            }')
          aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy hymn-api (production)" \
            --parameters "$PARAMS"
