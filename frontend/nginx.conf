# Replaces the stock nginx:alpine default.conf, which serves files and nothing
# else. This is a single-page app: every path except the asset files is a client
# route that exists only after index.html has loaded and React Router has run.
#
# Without the fallback below, any request that is not a real file is answered
# with nginx's own 404 page — and that is not only about users typing URLs:
#
#   - /reset-password?token=… is opened from a mail client, which can only issue
#     a plain GET. There is no way for it to arrive client-side.
#   - api/client.ts navigates with window.location.replace("/login") on logout
#     and whenever a refresh fails. Those are full page loads, so they hit nginx
#     too, and both were answering 404 in production.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so a name that resolves can never be stale. `expires` is
    # deliberately not used alongside this: it emits a Cache-Control of its own
    # and the response would carry the header twice, which caches disagree about.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # $uri first: a real file still wins, so assets and favicon are served
        # normally and only unmatched paths fall through to the app.
        try_files $uri $uri/ /index.html;
    }

    # index.html carries the script tags pointing at the hashed bundles. Cached,
    # it would keep sending returning visitors to the previous deploy's assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
