server {
    listen 80;
    server_name www.score-hymn.com staging.score-hymn.com;

    access_log /var/log/nginx/score-hymn.access.log;
    error_log  /var/log/nginx/score-hymn.error.log;

    # certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.score-hymn.com;

    ssl_certificate     /etc/letsencrypt/live/www.score-hymn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.score-hymn.com/privkey.pem;

    access_log /var/log/nginx/score-hymn.access.log;
    error_log  /var/log/nginx/score-hymn.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# retired domain — permanent redirect to www (cert kept for the TLS handshake)
server {
    listen 443 ssl;
    server_name staging.score-hymn.com;

    ssl_certificate     /etc/letsencrypt/live/staging.score-hymn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.score-hymn.com/privkey.pem;

    return 301 https://www.score-hymn.com$request_uri;
}
