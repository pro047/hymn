name: Build and Deploy (Staging)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO_STAGING }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image_uri: ${{ steps.image-uri.outputs.backend_image }}
      frontend_image_uri: ${{ steps.image-uri.outputs.frontend_image }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (cache for pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (for cache warm)
        run: pip install -r backend/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend (multi-arch)
        id: build-push-backend
        uses: docker/build-push-action@v5
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Build and push frontend (multi-arch)
        id: build-push-frontend
        uses: docker/build-push-action@v5
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-frontend
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}-frontend
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_API_URL_STAGING }}

      - name: Set image outputs
        id: image-uri
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "backend_image=${REGISTRY}/${ECR_REPO}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${REGISTRY}/${ECR_REPO}:${{ github.sha }}-frontend" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read compose file
        id: compose-file
        run: |
          echo 'content<<EOF' >> $GITHUB_OUTPUT
          cat docker-compose.staging.yml >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (docker compose pull && up)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_BACKEND: ${{ needs.build-and-push.outputs.backend_image_uri }}
          IMAGE_FRONTEND: ${{ needs.build-and-push.outputs.frontend_image_uri }}
          ECR_REPO: ${{ env.ECR_REPO }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET_INSTANCE: ${{ secrets.EC2_INSTANCE_ID_STAGING }}
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
          COMPOSE_CONTENT: ${{ steps.compose-file.outputs.content }}
        run: |
          set -e
          IMG_BACKEND="${IMAGE_BACKEND}"
          IMG_FRONTEND="${IMAGE_FRONTEND}"
          if [ -z "$IMG_BACKEND" ] || [ -z "$IMG_FRONTEND" ]; then
            ACCT=$(aws sts get-caller-identity --query Account --output text)
            IMG_BACKEND="${ACCT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}"
            IMG_FRONTEND="${ACCT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}-frontend"
          fi
          PARAMS=$(jq -n \
            --arg img_backend "${IMG_BACKEND}" \
            --arg img_frontend "${IMG_FRONTEND}" \
            --arg env "${ENV_STAGING}" \
            --arg region "${AWS_REGION}" \
            --arg compose "${COMPOSE_CONTENT}" \
            '{
              commands: [
                "if [ -z \"" + $img_backend + "\" ] || [ -z \"" + $img_frontend + "\" ]; then echo \"IMAGE_URI missing\" && exit 1; fi",
                "REGISTRY=$(echo \"" + $img_backend + "\" | cut -d/ -f1)",
                "aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin $REGISTRY",
                "sudo mkdir -p /app",
                "cat > /app/docker-compose.staging.yml <<\"YAML\"\n" + $compose + "\nYAML",
                "echo \"IMAGE_BACKEND=" + $img_backend + "\" | sudo tee /app/.env.staging >/dev/null",
                "echo \"IMAGE_FRONTEND=" + $img_frontend + "\" | sudo tee -a /app/.env.staging >/dev/null",
                "printf \"" + $env + "\\n\" | sudo tee -a /app/.env.staging >/dev/null",
                "cd /app && sudo docker compose --env-file /app/.env.staging -f /app/docker-compose.staging.yml pull && sudo docker compose --env-file /app/.env.staging -f /app/docker-compose.staging.yml up -d"
              ]
            }')
          aws ssm send-command \
            --instance-ids "$TARGET_INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy hymn-api (staging)" \
            --parameters "$PARAMS"
