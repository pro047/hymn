[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are safe as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# conftest must set env vars before importing app modules.
"tests/conftest.py" = ["E402"]
# alembic env configures sys.path before imports.
"alembic/env.py" = ["E402"]
# alembic template places revision identifiers before imports.
"alembic/versions/*.py" = ["E402"]
